name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (base + dev extras)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      # Note: the `ml` extra (torch/transformers/peft) is intentionally not
      # installed in CI — Stage 2 (neural_ner.py) requires a GPU-friendly
      # environment and is exercised via manual/local runs, not CI. The test
      # suite above covers the deterministic components only (Stages 1, 3,
      # 4, 5, attack operators, metrics, corpus generation), since these
      # require no trained model or GPU and are fully reproducible in CI.
